# Keep the original protocol when a proxy (Cloudflare...) sits in front of nginx
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Docker DNS: re-resolve containers when they restart (their ip can change)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://api:8000;
    set $nextjs http://frontend:3000;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Django static files (admin, ckeditor...) collected by `collectstatic`
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # User uploads
    location /medias/ {
        alias /var/www/medias/;
        expires 30d;
        access_log off;
    }

    # Django: API, admin and the ckeditor upload endpoint used by the admin
    location ~ ^/(api|admin|ckeditor5)(/|$) {
        proxy_pass $django;
        proxy_read_timeout 3600s;
    }

    # Everything else: Next.js
    location / {
        proxy_pass $nextjs;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
